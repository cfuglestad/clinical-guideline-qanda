[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-guideline-qanda"
version = "0.1.0"
description = "RAG-based Q&A over clinical practice guidelines with retrieval evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Connor Fuglestad" }]
keywords = ["healthcare", "nlp", "rag", "clinical-guidelines", "langgraph"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "langchain>=0.3,<1",
  "langgraph>=0.2,<1",
  "langchain-openai>=0.2,<1",
  "langchain-community>=0.3,<1",
  "chromadb>=0.5,<1",
  "pypdf>=5.0,<7",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
semantic = [
  "sentence-transformers>=3.0,<6",
]
dev = [
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<8",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[project.urls]
Homepage = "https://github.com/cfuglestad/clinical-guideline-qanda"
Repository = "https://github.com/cfuglestad/clinical-guideline-qanda"
Issues = "https://github.com/cfuglestad/clinical-guideline-qanda/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "chromadb.*",
  "langchain.*",
  "langchain_openai.*",
  "langchain_community.*",
  "langgraph.*",
  "sentence_transformers.*",
  "streamlit.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
